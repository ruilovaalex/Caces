# Blueprint de Render (plan gratuito) para el backend. Render > New > Blueprint > repositorio ruilovaalex/Caces.
# La base de datos y los archivos NO viven en Render: se usan Supabase (PostgreSQL + almacenamiento compatible con S3).
# Limites del plan gratuito: el servicio se "duerme" tras ~15 min sin uso (el primer acceso tarda ~1 min).
services:
  - type: web
    name: caces-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    # El plan gratuito no admite preDeployCommand: el CMD del Dockerfile corre las migraciones al iniciar (son idempotentes).
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://caces.vercel.app
      - key: FRONTEND_URL
        value: https://caces.vercel.app
      - key: MAIL_DRIVER
        value: none
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      # Los siguientes se escriben en el panel de Render (secretos o datos de tu proyecto de Supabase):
      - key: DATABASE_URL
        sync: false     # cadena "Session pooler" de Supabase (IPv4)
      - key: S3_BUCKET
        sync: false     # por ejemplo: evidencias
      - key: S3_REGION
        sync: false     # la region del proyecto de Supabase
      - key: S3_ENDPOINT
        sync: false     # https://<ref>.storage.supabase.co/storage/v1/s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
